# גיבוי: אם Kesef.xcodeproj לא נפתח בגרסת ה-Xcode שלך — `brew install xcodegen && xcodegen` ייצור אותו מחדש.
name: Kesef
options:
  bundleIdPrefix: il.chaverim4
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Kesef:
    type: application
    platform: iOS
    sources: [Kesef]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.chaverim4.kesef
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "הכסף שלי"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID משמש לנעילת המידע הפיננסי שלך באפליקציה."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
  KesefTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KesefTests, Tests/FinanceCoreTests]
    dependencies:
      - target: Kesef
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kesef:
    build:
      targets: { Kesef: all, KesefTests: [test] }
    test:
      targets: [KesefTests]
