# בנייה ובדיקות על Mac בענן של GitHub — בלי צורך ב-Mac פרטי.
name: iOS build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Finance core (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        run: swift test

  app:
    name: Build app + run all tests on iOS simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version && xcrun simctl list runtimes
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          ios=[(k,v) for k,v in d.items() if "iOS" in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split("iOS-")[-1].split("-")])
          for k,v in reversed(ios):
              for dev in v:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"
      - name: Build and test
        run: |
          STATUS=0
          xcodebuild test \
            -project Kesef.xcodeproj \
            -scheme Kesef \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 || STATUS=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|BUILD SUCCEEDED|BUILD FAILED|TEST SUCCEEDED|TEST FAILED" xcodebuild.log | sort -u | head -300 || true
          exit $STATUS
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 7
